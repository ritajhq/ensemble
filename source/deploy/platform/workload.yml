release:
  server:
    kit: docker
  web:
    kit: docker

deploy:
  compute:
    server:
      type: container-orchestrated
      image: ${release.server.image}
      replicas: 1
      env:
        ENSEMBLE_WORKSPACE: /data
      ports:
        http: 8787
      health:
        path: /v1/debug
        interval: 10
        timeout: 3
      mounts:
        - storage: state
          path: /data
      development:
        sync:
          - app: server
            path: /app/server

    web:
      type: container-orchestrated
      image: ${release.web.image}
      replicas: 1
      ports:
        http: 8000
      env:
        LIVE_RELOAD: "true"
        INJECT_API_ENDPOINT: http://localhost:8080/api
      development:
        sync:
          - app: web
            path: /app/www
            action: sync

  storage:
    state:
      type: file-storage

  networking:
    edge:
      type: gateway
      network: ${external.host-edge.name}
      routes:
        - path: /v1/*
          target: ${compute.server.http}
        - path: /*
          target: ${compute.web.http}

  external:
    host-edge:
      type: network
      name: edge
