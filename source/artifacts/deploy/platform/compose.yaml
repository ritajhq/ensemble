services:
  auth:
    image: 'platform-auth:latest'
    environment:
      KHATM_STORE: /data/khatm.db
      KHATM_ARTIFACTS: /data/artifacts
      KHATM_CONTROL_PORT: '4101'
      DATABASE: /data/auth.db
      AUTH_BASE_URL: 'https://auth.ensemble.blue'
      PLATFORM_ORIGIN: 'https://platform.ensemble.blue'
      AUTH_COOKIE_DOMAIN: ensemble.blue
      PLATFORM_ADMIN_EMAIL: operator@ensemble.blue
      AUTH_SECRET: '${AUTH_SECRET:?}'
    networks:
      - platform
    volumes:
      - 'auth-data:/data'
    restart: always
  guard:
    image: 'platform-guard:latest'
    environment:
      PROXY_PORT: '8080'
      JUDGE_SERVER_URL: 'http://ensemble-platform-judge-1:8081'
      UPSTREAM_URL: 'http://ensemble-platform-platform-1:8090'
    networks:
      - platform
    restart: always
  guard-previews:
    image: 'platform-preview-guard:latest'
    environment:
      PROXY_PORT: '8080'
      JUDGE_SERVER_URL: 'http://ensemble-platform-judge-1:8081'
      UPSTREAM_URL: 'http://ensemble-platform-router-1:8082'
    networks:
      - platform
    restart: always
  judge:
    image: 'platform-judge:latest'
    environment:
      JUDGE_PORT: '8081'
      POLICY_SOURCE_URL: 'http://ensemble-platform-policies-1:8082'
      POLICY_POLL_MS: '5000'
    networks:
      - platform
    restart: always
  platform:
    image: 'platform:latest'
    environment:
      PORT: '8090'
      PLATFORM_WORKSPACE: /var/lib/ens-platform/workspace
      PLATFORM_DATABASE: /var/lib/ens-platform/platform.kv
      PLATFORM_ROUTER_CONFIG: /router/Caddyfile
      PLATFORM_PREVIEW_DOMAIN: ensemble.blue
      PLATFORM_URL: 'https://platform.ensemble.blue'
      PLATFORM_ROUTES: >-
        platform.ensemble.blue=http://ensemble-platform-guard-1:8080,auth.ensemble.blue=http://ensemble-platform-auth-1:4100
      PLATFORM_PREVIEW_GUARD: 'http://ensemble-platform-guard-previews-1:8080'
      PLATFORM_SESSION_COOKIE: __Secure-platform.session_token
      DOCKER_CONFIG: /docker
      PLATFORM_STACK: ensemble-platform
      PLATFORM_RUNS_IMAGE: 'platform:latest'
      PLATFORM_RUNS_MOUNTS: >-
        /var/run/docker.sock:/var/run/docker.sock,/var/lib/ens-platform/docker:/docker
      PLATFORM_RUNS_DATA: 'ensemble-platform_platform-data:/var/lib/ens-platform'
      DENO_DIR: /var/lib/ens-platform/deno
      PLATFORM_SECRET_KEY: '${PLATFORM_SECRET_KEY:?}'
    networks:
      - platform
    volumes:
      - 'platform-data:/var/lib/ens-platform'
      - 'router-config:/router'
      - '/var/run/docker.sock:/var/run/docker.sock'
      - '/var/lib/ens-platform/docker:/docker'
    develop:
      watch:
        - path: platform/web
          target: /app/web
          action: sync
          initial_sync: true
        - path: cli
          target: /app/ens
          action: sync
          initial_sync: true
        - path: platform/server
          target: /app/server
          action: sync+restart
          initial_sync: true
    restart: always
  policies:
    image: 'platform-policies:latest'
    environment:
      BUILDER_PORT: '8082'
      POLICY_SOURCE: upload
      STATE_DIR: /var/lib/policy-builder
    networks:
      - platform
    volumes:
      - 'policy-state:/var/lib/policy-builder'
    restart: always
  router:
    image: 'platform-router:latest'
    environment: {}
    networks:
      - ingress
      - platform
    volumes:
      - 'router-config:/router:ro'
    restart: always
  gateway:
    image: 'caddy:2.11-alpine'
    networks:
      platform:
        aliases:
          - '${COMPOSE_PROJECT_NAME}'
      default: null
    labels:
      caddy: 'ensemble.blue, *.ensemble.blue'
      caddy.tls: internal
      caddy.reverse_proxy: '{{upstreams 80}}'
    configs:
      - source: gateway-caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - 'gateway-data:/data'
volumes:
  auth-data: {}
  platform-data: {}
  policy-state: {}
  router-config: {}
  gateway-data: {}
networks:
  platform:
    external: true
  ingress:
    external: true
configs:
  gateway-caddyfile:
    content: "http://ensemble.blue {\n\thandle /* {\n\t\treverse_proxy http://router:80\n\t}\n}\n\nhttp://*.ensemble.blue {\n\thandle /* {\n\t\treverse_proxy http://router:80\n\t}\n}\n"
