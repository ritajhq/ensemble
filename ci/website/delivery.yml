# yaml-language-server: $schema=../../docs/delivery.schema.json
version: v1

release:
  website:
    kit: docker

deploy:
  compute:
    server:
      type: container-orchestrated
      image: ${release.website}
      replicas: 1
      ports:
        http: 8000
      networks:
        - ${external.edge.name}
      development:
        sync:
          - app: website/server
            path: /app/server
          - app: website/content
            path: /app/content

  external:
    edge:
      type: network
      name: edge