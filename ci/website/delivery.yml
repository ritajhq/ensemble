# yaml-language-server: $schema=../../docs/delivery.schema.json
version: v1

release:
  website:
    kit: docker

deploy:
  compute:
    server:
      type: container
      image: ${release.website}
      replicas: 1
      ports:
        http: 8000
      env:
        DOCS_DIR: /data/docs
        DOCS_REPOSITORY: ${variables.docs-repository.value}
        DOCS_REF: ${variables.docs-ref.value}
        DOCS_POLL_SECONDS: ${variables.docs-poll-seconds.value}
      mounts:
        - source: ${storage.docs-content.name}
          path: /data
      development:
        sync:
          - app: website/server
            path: /app/server
          - app: website/content
            path: /app/content

  networking:
    # What fronts the stack on the edge network.
    gateway:
      type: gateway
      networks:
        - ${external.edge.name}
      routes:
        - host: ${variables.domain.value}
          path: /*
          target:
            service: server
            port: ${compute.server.http}

  storage:
    # The published docs, kept across restarts so the site has them at once.
    docs-content:
      type: volume

  variables:
    domain:
      default: docs.ensemble.lvh.me
      description: Host the website answers on
    docs-repository:
      default: ritajhq/ensemble
      description: GitHub repository (owner/name) the docs are published from
    docs-ref:
      default: main
      description: Branch or tag of that repository the docs follow
    docs-poll-seconds:
      default: "300"
      description: Seconds between checks of the repository for new commits

  external:
    edge:
      type: network
      name: edge
