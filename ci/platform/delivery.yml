# yaml-language-server: $schema=../../docs/delivery.schema.json
version: v1

# The platform, the router in front of every deployment it makes, and what
# protects both: an idhn guard in front of the platform, another every
# preview is asked through, the judge they ask, the policies it judges with,
# and the khatm everyone signs in with. Bring it up once per host, with
# `--emulate-externals` the first time so the `ingress` and `platform`
# networks exist:
#
#   export PLATFORM_SECRET_KEY=$(openssl rand -base64 32)   # keep it: secrets sealed with one key open with no other
#   export AUTH_SECRET=$(openssl rand -base64 32)
#   export GITHUB_TOKEN=…                                    # clones private repositories, pushes releases
#   ens deploy platform compose --artifacts local --emulate-externals
#
# The guards, judge, policy builder and khatm are built FROM published idhn
# and khatm images; each Dockerfile names its default, and a host builds from
# its own registry or version with a pack var (source/envs/pack/<ship>.env:
# GUARD_IMAGE, JUDGE_IMAGE, BUILDER_IMAGE, KHATM_IMAGE).
#
# The router answers plain HTTP on the ingress network; point the tunnel at it
# there (${variables.stack.value}-router-1:80), for the platform's host, its
# auth host and every host under the preview domain. TLS ends at the tunnel.
release:
  platform:
    kit: docker
  platform-router:
    kit: docker
  platform-guard:
    kit: docker
  platform-preview-guard:
    kit: docker
  platform-judge:
    kit: docker
  platform-policies:
    kit: docker
  platform-auth:
    kit: docker

deploy:
  compute:
    platform:
      type: container-orchestrated
      class: critical
      image: ${release.platform}
      replicas: 1
      ports:
        http: 8090
      # Reached by its guard alone: never on the ingress network, where
      # every deployment is.
      networks:
        - ${external.platform.name}
      env:
        PORT: "8090"
        PLATFORM_WORKSPACE: /var/lib/ens-platform/workspace
        PLATFORM_DATABASE: /var/lib/ens-platform/platform.kv
        PLATFORM_ROUTER_CONFIG: /router/Caddyfile
        PLATFORM_PREVIEW_DOMAIN: ${variables.preview_domain.value}
        # What the router answers for the platform itself, before any
        # deployment: its UI through its guard, its sign-in. Containers are
        # named, not services, so no deployment naming a service `guard` or
        # `auth` on the ingress network can answer for them.
        PLATFORM_ROUTES: ${variables.platform_host.value}=http://${variables.stack.value}-guard-1:8080,${variables.auth_host.value}=http://${variables.stack.value}-auth-1:4100
        PLATFORM_PREVIEW_GUARD: http://${variables.stack.value}-guard-previews-1:8080
        PLATFORM_SESSION_COOKIE: __Secure-platform.session_token
        PLATFORM_GIT_NAME: ${variables.git_name.value}
        PLATFORM_GIT_EMAIL: ${variables.git_email.value}
        # Where docker finds its registry logins, for every deploy and
        # release pack it runs.
        DOCKER_CONFIG: /docker
        # Each run — deploy, release or preview change — gets a container of
        # its own from this image, with what the platform mounts below, so a
        # run that redeploys the platform outlives the platform it replaces,
        # and the platform that comes back follows it to its end. The data
        # volume by its full name: `docker run` isn't compose, and doesn't
        # prefix it with the stack.
        PLATFORM_RUNS_IMAGE: ${release.platform}
        PLATFORM_RUNS_MOUNTS: ${variables.stack.value}_platform-data:/var/lib/ens-platform,/var/run/docker.sock:/var/run/docker.sock,${variables.registry_credentials.value}:/docker
        # Kits' dependencies, cached beside the platform's data rather than in
        # each run's container, where they'd be fetched again every run.
        DENO_DIR: /var/lib/ens-platform/deno
      envSecrets:
        PLATFORM_SECRET_KEY: platform-secret-key
        GITHUB_TOKEN: github-token
      mounts:
        - source: ${storage.platform-data.name}
          path: /var/lib/ens-platform
        - source: ${storage.router-config.name}
          path: /router
        # The host's Docker daemon, which every deploy and release pack runs
        # against. A host path, which the container-orchestrated contract
        # doesn't model: it works on compose, which takes it as a bind mount.
        - source: /var/run/docker.sock
          path: /var/run/docker.sock
        # The host directory holding the platform's own registry logins
        # (`DOCKER_CONFIG=<it> docker login ghcr.io`): what deploys pull
        # published images with, and release packs push them with. Writable:
        # buildx keeps its state beside them.
        - source: ${variables.registry_credentials.value}
          path: /docker

    # Joins the ingress network every deployment's gateway is on, and the
    # platform's, where it reaches the platform's guard, the previews' guard
    # and khatm. It reads its configuration from the platform alone.
    router:
      type: container-orchestrated
      class: critical
      image: ${release.platform-router}
      replicas: 1
      ports:
        http: 80
      networks:
        - ${external.ingress.name}
        - ${external.platform.name}
      mounts:
        - source: ${storage.router-config.name}
          path: /router
          readOnly: true

    # The platform's own guard: only operators reach its UI and API; GitHub's
    # webhooks reach it unsigned-in, each verified by its project's secret.
    guard:
      type: container-orchestrated
      class: critical
      image: ${release.platform-guard}
      replicas: 1
      ports:
        http: 8080
      networks:
        - ${external.platform.name}
      env:
        PROXY_PORT: "8080"
        JUDGE_SERVER_URL: http://judge:8081
        UPSTREAM_URL: http://platform:8090

    # What the router asks before letting a request through to any preview
    # (forward_auth): allowed, it is proxied to the router's own listener,
    # which answers who the guard says is calling.
    guard-previews:
      type: container-orchestrated
      class: critical
      image: ${release.platform-preview-guard}
      replicas: 1
      ports:
        http: 8080
      networks:
        - ${external.platform.name}
      env:
        PROXY_PORT: "8080"
        JUDGE_SERVER_URL: http://judge:8081
        UPSTREAM_URL: http://${variables.stack.value}-router-1:8082

    # Internal only: the guards ask it, judging with what the policy builder
    # last published: the platform's base policies.
    judge:
      type: container-orchestrated
      class: critical
      image: ${release.platform-judge}
      replicas: 1
      ports:
        http: 8081
      networks:
        - ${external.platform.name}
      env:
        JUDGE_PORT: "8081"
        POLICY_SOURCE_URL: http://policies:8082
        POLICY_POLL_MS: "5000"

    policies:
      type: container-orchestrated
      class: critical
      image: ${release.platform-policies}
      replicas: 1
      ports:
        http: 8082
      networks:
        - ${external.platform.name}
      env:
        BUILDER_PORT: "8082"
        POLICY_SOURCE: upload
        STATE_DIR: /var/lib/policy-builder
      mounts:
        - source: ${storage.policy-state.name}
          path: /var/lib/policy-builder

    # Who signs in: the platform's khatm. Its cookie is set on the preview
    # domain, so one sign-in reaches the platform and every preview.
    auth:
      type: container-orchestrated
      class: critical
      image: ${release.platform-auth}
      replicas: 1
      ports:
        http: 4100
        control: 4101
      networks:
        - ${external.platform.name}
      env:
        KHATM_STORE: /data/khatm.db
        KHATM_ARTIFACTS: /data/artifacts
        KHATM_CONTROL_PORT: "4101"
        DATABASE: /data/auth.db
        AUTH_BASE_URL: https://${variables.auth_host.value}
        PLATFORM_ORIGIN: https://${variables.platform_host.value}
        AUTH_COOKIE_DOMAIN: ${variables.preview_domain.value}
        PLATFORM_ADMIN_EMAIL: ${variables.admin_email.value}
      envSecrets:
        AUTH_SECRET: auth-secret
      mounts:
        - source: ${storage.auth-data.name}
          path: /data

  storage:
    # Checkouts, and the platform's own database.
    platform-data:
      type: volume
    # The router's Caddyfile, written by the platform.
    router-config:
      type: volume
    # The last policies the builder published, so the judge gets them back
    # after a restart.
    policy-state:
      type: volume
    # khatm's store, its sign-ins' database and revision artifacts.
    auth-data:
      type: volume

  secrets:
    platform-secret-key:
      source: environment
    github-token:
      source: environment
    auth-secret:
      source: environment

  variables:
    # The compose project this stack runs as — `<checkout directory>-platform`
    # — which its containers are named after.
    stack:
      default: ensemble-platform
    platform_host:
      default: platform.ensemble.blue
    auth_host:
      default: auth.ensemble.blue
    # Previews answer one label beneath it; the platform's sign-in cookie is
    # set on it, so it must hold the platform and auth hosts too.
    preview_domain:
      default: ensemble.blue
    # The first operator, created on khatm's first start.
    admin_email:
      default: operator@ensemble.blue
    git_name:
      default: ensemble platform
    git_email:
      default: platform@ensemble.blue
    # The host directory mounted as the platform's DOCKER_CONFIG. Docker
    # creates it empty if it's missing: no registry logins until one is made.
    registry_credentials:
      default: /var/lib/ens-platform/docker

  external:
    ingress:
      type: network
      name: ingress
    # The router, the platform and what protects it, alone.
    platform:
      type: network
      name: platform
