# yaml-language-server: $schema=../../docs/delivery.schema.json
version: v1

# The platform, the router in front of every deployment it makes, and what
# protects both: an idhn guard in front of the platform, another every
# preview is asked through, the judge they ask, the policies it judges with,
# and the khatm everyone signs in with. Bring it up once per host, with
# `--emulate-externals` the first time so the `ingress` and `platform`
# networks exist:
#
#   export PLATFORM_SECRET_KEY=$(openssl rand -base64 32)   # keep it: secrets sealed with one key open with no other
#   export AUTH_SECRET=$(openssl rand -base64 32)
#   ens deploy platform compose --artifacts local --emulate-externals
#
# The platform reaches GitHub as a GitHub App of its own, made on its home page
# the first time it's opened, and installed on the repositories it releases
# and deploys: no token to give it.
#
# The guards, judge, policy builder and khatm are built FROM published idhn
# and khatm images; each Dockerfile names its default, and a host builds from
# its own registry or version with a pack var (source/envs/pack/<ship>.env:
# GUARD_IMAGE, JUDGE_IMAGE, BUILDER_IMAGE, KHATM_IMAGE).
#
# The router answers plain HTTP on the ingress network; point the tunnel at it
# there (${variables.stack.value}-router-1:80), for the platform's host, its
# auth host and every host under the preview domain. TLS ends at the tunnel.
# Each image is published with every release, so a host deploys a version
# without building it: pushing needs docker logged in to ghcr.io with a
# token that may write packages, and deploying one that may read them.
release:
  platform:
    kit: docker
    publish:
      target: push
      name: ghcr.io/ritajhq/ensemble/platform
  platform-router:
    kit: docker
    publish:
      target: push
      name: ghcr.io/ritajhq/ensemble/platform-router
  platform-guard:
    kit: docker
    publish:
      target: push
      name: ghcr.io/ritajhq/ensemble/platform-guard
  platform-preview-guard:
    kit: docker
    publish:
      target: push
      name: ghcr.io/ritajhq/ensemble/platform-preview-guard
  platform-judge:
    kit: docker
    publish:
      target: push
      name: ghcr.io/ritajhq/ensemble/platform-judge
  platform-policies:
    kit: docker
    publish:
      target: push
      name: ghcr.io/ritajhq/ensemble/platform-policies
  platform-auth:
    kit: docker
    publish:
      target: push
      name: ghcr.io/ritajhq/ensemble/platform-auth

deploy:
  compute:
    platform:
      type: container
      image: ${release.platform}
      replicas: 1
      ports:
        http: 8090
      # Reached by its guard alone: never on the ingress network, where
      # every deployment is.
      networks:
        - ${external.platform.name}
      env:
        PORT: "8090"
        PLATFORM_WORKSPACE: /var/lib/ens-platform/workspace
        PLATFORM_DATABASE: /var/lib/ens-platform/platform.kv
        PLATFORM_ROUTER_CONFIG: /router/Caddyfile
        PLATFORM_PREVIEW_DOMAIN: ${variables.preview_domain.value}
        # Where the platform answers outside: its GitHub App's webhook and the
        # way back from creating it are under it.
        PLATFORM_URL: https://${variables.platform_host.value}
        # What the router answers for the platform itself, before any
        # deployment: its UI through its guard, its sign-in. Each is reached
        # by the compute's own host, which the deploy target makes one no
        # other deployment on the ingress network can answer for.
        PLATFORM_ROUTES: ${variables.platform_host.value}=http://${compute.guard.host}:${compute.guard.http},${variables.auth_host.value}=http://${compute.auth.host}:${compute.auth.http}
        PLATFORM_PREVIEW_GUARD: http://${compute.guard-previews.host}:${compute.guard-previews.http}
        PLATFORM_SESSION_COOKIE: __Secure-platform.session_token
        # Where docker finds its registry logins, for every deploy and
        # release pack it runs.
        DOCKER_CONFIG: /docker
        # The stack it runs as — `<project>-<manifest>` on the platform, as
        # the checkout is named after the project — so a deploy applying it is
        # known for an update of the platform: it waits for every run in
        # progress to finish, then runs alone, and runs asked for meanwhile
        # wait for the platform it brings up.
        PLATFORM_STACK: ${variables.stack.value}
        # Each run — deploy, release or preview change — gets a container of
        # its own from this image, with what the platform mounts below, so a
        # run that redeploys the platform outlives the platform it replaces,
        # and the platform that comes back follows it to its end.
        PLATFORM_RUNS_IMAGE: ${release.platform}
        PLATFORM_RUNS_MOUNTS: /var/run/docker.sock:/var/run/docker.sock,${variables.registry_credentials.value}:/docker
        # The data volume — by its full name: `docker run` isn't compose, and
        # doesn't prefix it with the stack — mounted where the platform has it
        # and where it is on the host. A run works in its checkout at the
        # host's path, so a file a deployment mounts from it (a database's
        # init script) is found by the host's Docker daemon.
        PLATFORM_RUNS_DATA: ${variables.stack.value}_platform-data:/var/lib/ens-platform
        # Kits' dependencies, cached beside the platform's data rather than in
        # each run's container, where they'd be fetched again every run.
        DENO_DIR: /var/lib/ens-platform/deno
      envSecrets:
        PLATFORM_SECRET_KEY: platform-secret-key
      mounts:
        - source: ${storage.platform-data.name}
          path: /var/lib/ens-platform
        - source: ${storage.router-config.name}
          path: /router
        # The host's Docker daemon, which every deploy and release pack runs
        # against. A host path, which the container contract
        # doesn't model: it works on compose, which takes it as a bind mount.
        - source: /var/run/docker.sock
          path: /var/run/docker.sock
        # The host directory holding the platform's own registry logins
        # (`DOCKER_CONFIG=<it> docker login ghcr.io`): what deploys pull
        # published images with, and release packs push them with. Writable:
        # buildx keeps its state beside them.
        - source: ${variables.registry_credentials.value}
          path: /docker

    # Joins the ingress network every deployment's gateway is on, and the
    # platform's, where it reaches the platform's guard, the previews' guard
    # and khatm. It reads its configuration from the platform alone.
    router:
      type: container
      image: ${release.platform-router}
      replicas: 1
      ports:
        http: 80
        # Where it answers who a preview's request is from, to the previews'
        # guard (not published: only the guard asks).
        previews: 8082
      networks:
        - ${external.ingress.name}
        - ${external.platform.name}
      mounts:
        - source: ${storage.router-config.name}
          path: /router
          readOnly: true

    # The platform's own guard: only operators reach its UI and API; GitHub's
    # webhooks reach it unsigned-in, each verified by its project's secret.
    guard:
      type: container
      image: ${release.platform-guard}
      replicas: 1
      ports:
        http: 8080
      networks:
        - ${external.platform.name}
      env:
        PROXY_PORT: "8080"
        JUDGE_SERVER_URL: http://${compute.judge.host}:${compute.judge.http}
        UPSTREAM_URL: http://${compute.platform.host}:${compute.platform.http}

    # What the router asks before letting a request through to any preview
    # (forward_auth): allowed, it is proxied to the router's own listener,
    # which answers who the guard says is calling.
    guard-previews:
      type: container
      image: ${release.platform-preview-guard}
      replicas: 1
      ports:
        http: 8080
      networks:
        - ${external.platform.name}
      env:
        PROXY_PORT: "8080"
        JUDGE_SERVER_URL: http://${compute.judge.host}:${compute.judge.http}
        UPSTREAM_URL: http://${compute.router.host}:${compute.router.previews}

    # Internal only: the guards ask it, judging with what the policy builder
    # last published: the platform's base policies.
    judge:
      type: container
      image: ${release.platform-judge}
      replicas: 1
      ports:
        http: 8081
      networks:
        - ${external.platform.name}
      env:
        JUDGE_PORT: "8081"
        POLICY_SOURCE_URL: http://${compute.policies.host}:${compute.policies.http}
        POLICY_POLL_MS: "5000"

    policies:
      type: container
      image: ${release.platform-policies}
      replicas: 1
      ports:
        http: 8082
      networks:
        - ${external.platform.name}
      env:
        BUILDER_PORT: "8082"
        POLICY_SOURCE: upload
        STATE_DIR: /var/lib/policy-builder
      mounts:
        - source: ${storage.policy-state.name}
          path: /var/lib/policy-builder

    # Who signs in: the platform's khatm. Its cookie is set on the preview
    # domain, so one sign-in reaches the platform and every preview.
    auth:
      type: container
      image: ${release.platform-auth}
      replicas: 1
      ports:
        http: 4100
        control: 4101
      networks:
        - ${external.platform.name}
      env:
        KHATM_STORE: /data/khatm.db
        KHATM_ARTIFACTS: /data/artifacts
        KHATM_CONTROL_PORT: "4101"
        DATABASE: /data/auth.db
        AUTH_BASE_URL: https://${variables.auth_host.value}
        PLATFORM_ORIGIN: https://${variables.platform_host.value}
        AUTH_COOKIE_DOMAIN: ${variables.preview_domain.value}
        PLATFORM_ADMIN_EMAIL: ${variables.admin_email.value}
      envSecrets:
        AUTH_SECRET: auth-secret
      mounts:
        - source: ${storage.auth-data.name}
          path: /data

  storage:
    # Checkouts, and the platform's own database.
    platform-data:
      type: volume
    # The router's Caddyfile, written by the platform.
    router-config:
      type: volume
    # The last policies the builder published, so the judge gets them back
    # after a restart.
    policy-state:
      type: volume
    # khatm's store, its sign-ins' database and revision artifacts.
    auth-data:
      type: volume

  secrets:
    platform-secret-key:
      source: environment
      description: Key the platform seals its stored secrets with; keep it, as secrets sealed with one key open with no other (PLATFORM_SECRET_KEY)
    auth-secret:
      source: environment
      description: Secret khatm signs sessions with (AUTH_SECRET)

  variables:
    stack:
      default: ensemble-platform
      description: Compose project name, which the containers are named after and the platform knows itself by
    platform_host:
      default: platform.ensemble.blue
      description: Host the platform's UI and its GitHub App webhook answer on
    auth_host:
      default: auth.ensemble.blue
      description: Host khatm's sign-in answers on
    preview_domain:
      default: ensemble.blue
      description: Domain previews answer one label beneath and the sign-in cookie is set on, so it must hold the platform and auth hosts too
    admin_email:
      default: operator@ensemble.blue
      description: Email of the first operator, created on khatm's first start
    registry_credentials:
      default: /var/lib/ens-platform/docker
      description: Host directory with the registry logins deploys pull and release packs push with; Docker creates it empty if missing, so no logins until one is made

  external:
    ingress:
      type: network
      name: ingress
    # The router, the platform and what protects it, alone.
    platform:
      type: network
      name: platform
