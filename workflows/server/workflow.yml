resources:
  repositories:
    ensemble:
      url: https://github.com/ritajhq/ensemble.git

jobs:
  pack:
    in:
      repository: ensemble
    steps:
      - name: build_server
        run: |
          echo "Building..."
          ens build -m production server

      - name: compile_cli
        run: |
          echo "Compiling..."
          ens pack cli deno.compile

      - name: build_web
        run: |
          echo "Building..."
          ens build -m production web

      - name: pack_server
        run: |
          echo "Packing..."
          ens pack -o ensemble/server server docker

      - name: pack_web
        run: |
          echo "Packing..."
          ens pack -o ensemble/web web docker

      - name: pack_hot-server
        run: |
          echo "Packing..."
          ens pack hot-server docker

      - name: tag_and_push
        run: |
          echo "Tagging and pushing..."
          docker image tag ensemble/server:latest registry.ritaj.app/ensemble/server:latest
          docker image tag ensemble/web:latest registry.ritaj.app/ensemble/web:latest
          docker image tag hot-server:latest registry.ritaj.app/hot-server:latest

          docker login registry.ritaj.app -u "$REGISTRY_USERNAME" -p "$REGISTRY_PASSWORD"

          docker push registry.ritaj.app/ensemble/server:latest
          docker push registry.ritaj.app/ensemble/web:latest
          docker push registry.ritaj.app/hot-server:latest