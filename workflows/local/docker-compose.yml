services:
  server:
    image: server:latest
    pull_policy: never
    expose:
      - "8787"
    volumes:
      - ./workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID}"
    environment:
      ENSEMBLE_RUNNER_IMAGE: runner:latest
      ENSEMBLE_HOST_WORKFLOWS_PATH: "${ENSEMBLE_HOST_WORKFLOWS_PATH}"
    user: "1000:1000"
    develop:
      watch:
        - action: sync+restart
          path: ../../source/artifacts/server
          target: /app/server
          initial_sync: true

  web:
    image: hot-server:latest
    pull_policy: never
    expose:
      - "8000"
    environment:
      LIVE_RELOAD: "true"
      INJECT_API_ENDPOINT: "http://localhost:8080/api"
    develop:
      watch:
        - action: sync
          path: ../../source/artifacts/web
          target: /app/www
          initial_sync: true

  caddy:
    image: caddy:alpine
    pull_policy: missing
    ports:
      - "8999:8000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - server
      - web
