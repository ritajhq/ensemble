# yaml-language-server: $schema=https://raw.githubusercontent.com/ritajhq/ensemble/main/.ensemble/schemas/workflow.schema.json
# yaml-embedded-languages: shell

on:
  - manual:
      inputs:
        - name: version
          type: git-tags
          repository: https://github.com/ritajhq/ensemble.git
          default: latest
          display: "Image tag to deploy"

context:
  variables:
    - name: IMAGE_REGISTRY
    - name: SERVER_RUNNER_IMAGE
    - name: SERVER_WORKSPACE_PATH
    - name: SERVER_HOST_WORKFLOWS_PATH
    - name: WEB_LIVE_RELOAD
    - name: WEB_API_ENDPOINT
  files:
    - name: caddy_config
      path: Caddyfile
  secrets:
    variables:
      - name: GITHUB_WEBHOOK_SECRET

jobs:
  watch_build:
    if: "${{ context.name == 'development' }}"
    matrix:
      axes:
        target: [cli, server, web]
    in:
      repository: self
    steps:
      - name: "watch_build_${{ matrix.target }}"
        run: |
          PIDFILE="/tmp/ens-build-watch-${{ matrix.target }}.pid"
          if pid=$(cat "$PIDFILE" 2>/dev/null) && kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
          fi
          setsid ens build "${{ matrix.target }}" --watch </dev/null >"/tmp/ens-build-watch-${{ matrix.target }}.log" 2>&1 &
          echo $! > "$PIDFILE"

  watch_runner:
    if: "${{ context.name == 'development' }}"
    in:
      repository: self
    steps:
      - name: watch_pack_runner
        run: |
          PIDFILE=/tmp/ens-pack-watch-runner.pid
          if pid=$(cat "$PIDFILE" 2>/dev/null) && kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
          fi

          CLI_BUNDLE="${{ ensemble.artifacts('cli') }}/main.js"

          setsid sh -c '
            last=""
            while true; do
              current=$(stat -c %Y "'"$CLI_BUNDLE"'" 2>/dev/null || true)
              if [ -n "$current" ] && [ "$current" != "$last" ]; then
                echo "Packing runner..."
                ens pack -o ensemble/runner runner docker && docker tag ensemble/runner:latest runner:latest
                last="$current"
              fi
              sleep 1
            done
          ' </dev/null >/tmp/ens-pack-watch-runner.log 2>&1 &
          echo $! > "$PIDFILE"

  deploy:
    in:
      repository: self
    steps:
      - id: runtime_env
        name: resolve host facts and secrets
        run: |
          cd workflows/deploy

          runtime_env="$(mktemp)"
          {
            echo "SERVER_DOCKER_GID=$(stat -c %g /var/run/docker.sock)"
            echo "GITHUB_WEBHOOK_SECRET=$GITHUB_WEBHOOK_SECRET"
            echo "SERVER_HOST_WORKFLOWS_PATH=$(realpath -m "$SERVER_HOST_WORKFLOWS_PATH")"
            echo "IMAGE_TAG=${{ trigger.version }}"
          } > "$runtime_env"
          echo "runtime_env=$runtime_env" >> "$WORKFLOW_OUTPUT"

      - name: "docker compose up (context: ${{ context.name }})"
        if: "${{ context.name != 'development' }}"
        run: |
          cd workflows/deploy
          docker compose \
            --env-file "${{ steps.runtime_env.outputs.runtime_env }}" \
            up -d

      - name: "docker compose up, watch mode (context: ${{ context.name }})"
        if: "${{ context.name == 'development' }}"
        run: |
          cd workflows/deploy

          {
            echo "CADDY_CONFIG=${{ context.files.caddy_config.path }}"
            echo "ARTIFACTS_WEB=${{ ensemble.artifacts('web') }}"
            echo "ARTIFACTS_SERVER=${{ ensemble.artifacts('server') }}"
          } >> "${{ steps.runtime_env.outputs.runtime_env }}"

          docker compose \
            --env-file "${{ steps.runtime_env.outputs.runtime_env }}" \
            --profile dev \
            up --watch
