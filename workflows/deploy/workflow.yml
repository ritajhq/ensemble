# yaml-language-server: $schema=https://raw.githubusercontent.com/ritajhq/ensemble/main/.ensemble/schemas/workflow.schema.json
# yaml-embedded-languages: shell

on:
  - manual: {}

resources:
  repositories:
    ensemble:
      url: https://github.com/ritajhq/ensemble.git

context:
  secrets:
    - name: GITHUB_WEBHOOK_SECRET

jobs:
  watch_cli:
    if: "${{ context.name == 'development' }}"
    in:
      repository: ensemble
    steps:
      - name: watch_pack_cli
        run: |
          set -euo pipefail
          PIDFILE=/tmp/ens-pack-watch-cli.pid
          if pid=$(cat "$PIDFILE" 2>/dev/null) && kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
          fi
          setsid ens pack cli deno.compile --watch </dev/null >/tmp/ens-pack-watch-cli.log 2>&1 &
          echo $! > "$PIDFILE"

  watch_server:
    if: "${{ context.name == 'development' }}"
    in:
      repository: ensemble
    steps:
      - name: watch_build_server
        run: |
          set -euo pipefail
          PIDFILE=/tmp/ens-build-watch-server.pid
          if pid=$(cat "$PIDFILE" 2>/dev/null) && kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
          fi
          setsid ens build server --watch </dev/null >/tmp/ens-build-watch-server.log 2>&1 &
          echo $! > "$PIDFILE"

  watch_web:
    if: "${{ context.name == 'development' }}"
    in:
      repository: ensemble
    steps:
      - name: watch_build_web
        run: |
          set -euo pipefail
          PIDFILE=/tmp/ens-build-watch-web.pid
          if pid=$(cat "$PIDFILE" 2>/dev/null) && kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
          fi
          setsid ens build web --watch </dev/null >/tmp/ens-build-watch-web.log 2>&1 &
          echo $! > "$PIDFILE"

  deploy:
    in:
      repository: ensemble
    steps:
      - id: install_terraform
        name: install_terraform
        run: |
          set -euo pipefail
          tf_version="1.9.8"
          tf_bin="/tmp/terraform-${tf_version}/terraform"
          if [ ! -x "$tf_bin" ]; then
            mkdir -p "/tmp/terraform-${tf_version}"
            wget -qO /tmp/terraform.zip \
              "https://releases.hashicorp.com/terraform/${tf_version}/terraform_${tf_version}_linux_amd64.zip"
            unzip -qo /tmp/terraform.zip -d "/tmp/terraform-${tf_version}"
          fi
          echo "tf_bin=$tf_bin" >> "$WORKFLOW_OUTPUT"

      - name: terraform_init
        run: |
          set -euo pipefail
          cd workflows/deploy/terraform
          "${{ steps.install_terraform.outputs.tf_bin }}" init

      - name: "terraform_apply (context: ${{ context.name }})"
        run: |
          set -euo pipefail

          ARTIFACTS_WEB="${{ ensembleArtifacts('web') }}"
          ARTIFACTS_SERVER="${{ ensembleArtifacts('server') }}"
          CLI_PATH="${{ ensembleArtifacts('packages') }}/ensemble-linux-x64"

          cd workflows/deploy/terraform
          "${{ steps.install_terraform.outputs.tf_bin }}" apply -auto-approve \
            -var-file="${{ contextFile('tfvars.json') }}" \
            -var="artifacts_web=$ARTIFACTS_WEB" \
            -var="artifacts_server=$ARTIFACTS_SERVER" \
            -var="cli_path=$CLI_PATH" \
            -var="caddy_config=${{ contextFile('Caddyfile') }}" \
            -var="server_github_webhook_secret=$GITHUB_WEBHOOK_SECRET" \
            -var="server_docker_gid=$(getent group docker | cut -d: -f3)"
