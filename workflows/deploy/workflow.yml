# yaml-language-server: $schema=https://raw.githubusercontent.com/ritajhq/ensemble/main/.ensemble/schemas/workflow.schema.json
# yaml-embedded-languages: shell

on:
  - manual: {}

resources:
  repositories:
    ensemble:
      url: https://github.com/ritajhq/ensemble.git

context:
  variables:
    TF_VARS: {}
  secrets:
    - name: GITHUB_WEBHOOK_SECRET

jobs:
  deploy:
    in:
      repository: ensemble
    steps:
      - id: install_terraform
        name: install_terraform
        run: |
          set -euo pipefail
          tf_version="1.9.8"
          tf_bin="/tmp/terraform-${tf_version}/terraform"
          if [ ! -x "$tf_bin" ]; then
            mkdir -p "/tmp/terraform-${tf_version}"
            wget -qO /tmp/terraform.zip \
              "https://releases.hashicorp.com/terraform/${tf_version}/terraform_${tf_version}_linux_amd64.zip"
            unzip -qo /tmp/terraform.zip -d "/tmp/terraform-${tf_version}"
          fi
          echo "tf_bin=$tf_bin" >> "$WORKFLOW_OUTPUT"

      - name: terraform_init
        run: |
          set -euo pipefail
          cd workflows/deploy/terraform
          "${{ steps.install_terraform.outputs.tf_bin }}" init

      - name: terraform_apply
        run: |
          set -euo pipefail

          ARTIFACTS_DIR=$(realpath source/artifacts)

          cd workflows/deploy/terraform
          "${{ steps.install_terraform.outputs.tf_bin }}" apply -auto-approve \
            -var-file="$TF_VARS_FILE" \
            -var="artifacts_dir=$ARTIFACTS_DIR" \
            -var="server_github_webhook_secret=$GITHUB_WEBHOOK_SECRET" \
            -var="server_docker_gid=$(getent group docker | cut -d: -f3)"
