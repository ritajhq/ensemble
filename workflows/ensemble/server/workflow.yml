jobs:
  pack:
    steps:
      - name: build_server
        run: |
          echo "Building..."
          deno task cli build server

      - name: compile_cli
        run: |
          echo "Compiling..."
          deno task cli pack cli deno.compile 

      - name: pack_server
        run: |
          echo "Packing..."
          deno task cli pack -o ensemble/server server docker

      - name: tag_and_push
        run: |
          echo "Tagging and pushing..."
          docker image tag ensemble/server:latest registry.ritaj.app/ensemble/server:latest
          docker push registry.ritaj.app/ensemble/server:latest