# yaml-language-server: $schema=https://raw.githubusercontent.com/ritajhq/ensemble/main/.ensemble/schemas/workflow.schema.json

on:
  - github:
      push:
        tags:
          - '*.*.*'
  - manual:
      inputs:
        - name: version
          type: string
          default: latest
          display: "Version tag (production only — local always uses latest)"

context:
  secrets:
    variables:
      - name: GH_TOKEN
        default: ''
      - name: REGISTRY_USERNAME
        default: ''
      - name: REGISTRY_PASSWORD
        default: ''

resources:
  repositories:
    ensemble:
      url: https://github.com/ritajhq/ensemble.git

jobs:
  release:
    in:
      repository: ensemble
    steps:
      - id: resolve_version
        name: resolve_version
        run: |
          set -euo pipefail
          if [ "${{ trigger.type }}" = "github" ]; then
            echo "version=${{ trigger.tag }}" >> "$WORKFLOW_OUTPUT"
          else
            echo "version=${{ trigger.version }}" >> "$WORKFLOW_OUTPUT"
          fi

      - name: docker_login
        if: "${{ context.name == 'production' }}"
        run: |
          set -euo pipefail
          docker login registry.ritaj.app -u "$REGISTRY_USERNAME" -p "$REGISTRY_PASSWORD"

      - name: compile_cli
        run: |
          set -euo pipefail
          ens pack cli deno.compile

      - name: build_server_image
        run: |
          set -euo pipefail
          ens build -m production server
          ens pack -o cli cli deno.compile

          ens pack server docker

      - name: build_web_image
        run: |
          set -euo pipefail
          ens build -m production web
          ens pack web docker

      - name: build_runner_image
        run: |
          set -euo pipefail
          ens pack -o ensemble/runner runner docker

      - name: build_hot_server_image
        run: |
          set -euo pipefail
          ens pack hot-server docker

      - name: publish_server_image
        if: "${{ context.name == 'production' }}"
        run: |
          set -euo pipefail

          VERSION="${{ steps.resolve_version.outputs.version }}"

          docker image tag server:latest registry.ritaj.app/ensemble/server:latest
          docker image tag server:latest registry.ritaj.app/ensemble/server:"$VERSION"

          docker push registry.ritaj.app/ensemble/server:latest
          docker push registry.ritaj.app/ensemble/server:"$VERSION"

      - name: publish_web_image
        if: "${{ context.name == 'production' }}"
        run: |
          set -euo pipefail

          VERSION="${{ steps.resolve_version.outputs.version }}"

          docker image tag web:latest registry.ritaj.app/ensemble/web:latest
          docker image tag web:latest registry.ritaj.app/ensemble/web:"$VERSION"

          docker push registry.ritaj.app/ensemble/web:latest
          docker push registry.ritaj.app/ensemble/web:"$VERSION"

      - name: publish_runner_image
        if: "${{ context.name == 'production' }}"
        run: |
          set -euo pipefail

          VERSION="${{ steps.resolve_version.outputs.version }}"

          docker image tag ensemble/runner:latest registry.ritaj.app/ensemble/runner:latest
          docker image tag ensemble/runner:latest registry.ritaj.app/ensemble/runner:"$VERSION"

          docker push registry.ritaj.app/ensemble/runner:latest
          docker push registry.ritaj.app/ensemble/runner:"$VERSION"

      - name: publish_hot_server_image
        if: "${{ context.name == 'production' }}"
        run: |
          set -euo pipefail
          # hot-server is a shared, unversioned runtime shell (not an
          # ensemble-specific build) — :latest only, no version tag.
          docker image tag hot-server:latest registry.ritaj.app/hot-server:latest
          docker push registry.ritaj.app/hot-server:latest

      - name: update_local_images
        if: "${{ context.name != 'production' }}"
        run: |
          set -euo pipefail
          # No registry involved locally — just make the freshly built images
          # available under the plain names the local deploy stack (and
          # server's spawned runner) actually reference: ensemble/server,
          # ensemble/web, runner:latest, and hot-server:latest (already the
          # right name — no retag needed) — see workflows/deploy.
          docker image tag server:latest ensemble/server:latest
          docker image tag web:latest ensemble/web:latest
          docker image tag ensemble/runner:latest runner:latest

