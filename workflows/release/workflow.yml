# yaml-language-server: $schema=https://raw.githubusercontent.com/ritajhq/ensemble/main/.ensemble/schemas/workflow.schema.json

on:
  # Only throwaway/test tags (e.g. "0.0.14-test") are excluded from
  # production — matched first, with no context, purely so they don't
  # fall through to the catch-all entry below. Real pre-release tags like
  # "1.0.0-alpha"/"1.0.1-beta" are still full production releases.
  - github:
      push:
        tags:
          - '*-test'
  # Everything else — plain semver ("1.2.3") and alpha/beta/rc pre-release
  # tags — triggers a real production release.
  - github:
      push:
        tags:
          - '*.*.*'
      context: production

  - manual:
      inputs:
        - name: version
          type: string
          default: latest
          display: "Version tag (production only — local always uses latest)"

context:
  secrets:
    variables:
      - name: GH_TOKEN
        default: ''
      - name: REGISTRY_USERNAME
        default: ''
      - name: REGISTRY_PASSWORD
        default: ''
      - name: JSR_TOKEN
        default: ''

resources:
  repositories:
    ensemble:
      url: https://github.com/ritajhq/ensemble.git

jobs:
  release:
    in:
      repository: ensemble
    steps:
      - id: resolve_version
        name: resolve_version
        run: |
          if [ "${{ trigger.type }}" = "github" ]; then
            echo "version=${{ trigger.tag }}" >> "$WORKFLOW_OUTPUT"
          else
            echo "version=${{ trigger.version }}" >> "$WORKFLOW_OUTPUT"
          fi

      - name: docker_login
        if: "${{ context.name == 'production' }}"
        run: |
          docker login registry.ritaj.app -u "$REGISTRY_USERNAME" -p "$REGISTRY_PASSWORD"

      - name: publish_jsr_packages
        if: "${{ context.name == 'production' }}"
        run: |
          VERSION="${{ steps.resolve_version.outputs.version }}"

          # JSR requires every jsr: import specifier a published package uses
          # to carry an explicit version constraint — the bare
          # "jsr:@scope/name" specifiers these deno.json files use locally
          # (resolved via workspace-name linking, not the registry) aren't
          # publishable as-is. Since all 4 packages are released in lockstep
          # under one version, pin_workspace_dep rewrites a dependent's own
          # deno.json to the exact version its already-published dependency
          # just got, right before that dependent is published in turn.
          pin_workspace_dep() {
            pkg_dir="$1"
            dep_name="$2"
            tmp="$(mktemp)"
            jq --arg name "$dep_name" --arg version "jsr:$dep_name@$VERSION" \
              '.imports[$name] = $version' \
              "$pkg_dir/deno.json" > "$tmp"
            mv "$tmp" "$pkg_dir/deno.json"
          }

          (cd source/libs/event && deno publish --set-version "$VERSION" --allow-slow-types --allow-dirty --token "$JSR_TOKEN")

          pin_workspace_dep source/core/workflow @ritaj/event
          (cd source/core/workflow && deno publish --set-version "$VERSION" --allow-slow-types --allow-dirty --token "$JSR_TOKEN")

          (cd source/core/kit-sdk && deno publish --set-version "$VERSION" --allow-slow-types --allow-dirty --token "$JSR_TOKEN")

          pin_workspace_dep source/core/core @ritaj/event
          pin_workspace_dep source/core/core @ensemble/workflow
          pin_workspace_dep source/core/core @ensemble/kit-sdk
          (cd source/core/core && deno publish --set-version "$VERSION" --allow-slow-types --allow-dirty --token "$JSR_TOKEN")

      - name: compile_cli
        run: |
          ens pack cli deno.compile

      - name: build_server_image
        run: |
          ens build -m production server
          ens pack -o cli cli deno.compile

          ens pack server docker

      - name: build_web_image
        run: |
          ens build -m production web
          ens pack web docker

      - name: build_runner_image
        run: |
          ens pack -o ensemble/runner runner docker

      - name: build_hot_server_image
        run: |
          ens pack hot-server docker

      - name: publish_server_image
        if: "${{ context.name == 'production' }}"
        run: |
          VERSION="${{ steps.resolve_version.outputs.version }}"

          docker image tag server:latest registry.ritaj.app/ensemble/server:latest
          docker image tag server:latest registry.ritaj.app/ensemble/server:"$VERSION"

          docker push registry.ritaj.app/ensemble/server:latest
          docker push registry.ritaj.app/ensemble/server:"$VERSION"

      - name: publish_web_image
        if: "${{ context.name == 'production' }}"
        run: |
          VERSION="${{ steps.resolve_version.outputs.version }}"

          docker image tag web:latest registry.ritaj.app/ensemble/web:latest
          docker image tag web:latest registry.ritaj.app/ensemble/web:"$VERSION"

          docker push registry.ritaj.app/ensemble/web:latest
          docker push registry.ritaj.app/ensemble/web:"$VERSION"

      - name: publish_runner_image
        if: "${{ context.name == 'production' }}"
        run: |
          VERSION="${{ steps.resolve_version.outputs.version }}"

          docker image tag ensemble/runner:latest registry.ritaj.app/ensemble/runner:latest
          docker image tag ensemble/runner:latest registry.ritaj.app/ensemble/runner:"$VERSION"

          docker push registry.ritaj.app/ensemble/runner:latest
          docker push registry.ritaj.app/ensemble/runner:"$VERSION"

      - name: publish_hot_server_image
        if: "${{ context.name == 'production' }}"
        run: |
          # hot-server is a shared, unversioned runtime shell (not an
          # ensemble-specific build) — :latest only, no version tag.
          docker image tag hot-server:latest registry.ritaj.app/hot-server:latest
          docker push registry.ritaj.app/hot-server:latest

      - name: update_local_images
        if: "${{ context.name != 'production' }}"
        run: |
          # No registry involved locally — just make the freshly built images
          # available under the plain names the local deploy stack (and
          # server's spawned runner) actually reference: ensemble/server,
          # ensemble/web, runner:latest, and hot-server:latest (already the
          # right name — no retag needed) — see workflows/deploy.
          docker image tag server:latest ensemble/server:latest
          docker image tag web:latest ensemble/web:latest
          docker image tag ensemble/runner:latest runner:latest

      - name: update_changelog
        if: "${{ context.name == 'production' }}"
        run: |
          tag="${{ steps.resolve_version.outputs.version }}"
          cliff_version="2.13.1"
          git_cliff="/tmp/git-cliff-${cliff_version}/git-cliff"
          if [ ! -x "$git_cliff" ]; then
            arch="$(uname -m)"
            wget -qO /tmp/git-cliff.tar.gz \
              "https://github.com/orhun/git-cliff/releases/download/v${cliff_version}/git-cliff-${cliff_version}-${arch}-unknown-linux-musl.tar.gz"
            tar -xzf /tmp/git-cliff.tar.gz -C /tmp
          fi

          "$git_cliff" --tag "$tag" -o CHANGELOG.md
          "$git_cliff" --tag "$tag" --latest --strip all -o /tmp/ensemble-release-notes.md

          gh auth setup-git
          git config user.name "ensemble-release-bot"
          git config user.email "release-bot@ritaj.app"
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(changelog): update for $tag"

            attempt=1
            max_attempts=5
            until git push origin HEAD:main; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "error: could not push changelog to main after $max_attempts attempts (main kept moving)." >&2
                exit 1
              fi
              echo "push rejected, main moved — rebasing and retrying ($attempt/$max_attempts)..."
              git fetch origin main
              git rebase origin/main
              attempt=$((attempt + 1))
            done
          fi

      - name: create_github_release
        if: "${{ context.name == 'production' }}"
        run: |
          tag="${{ steps.resolve_version.outputs.version }}"
          gh release create "$tag" \
            source/artifacts/packages/ensemble-linux-x64 \
            --title "$tag" \
            --notes-file /tmp/ensemble-release-notes.md \
            --repo ritajhq/ensemble
