# yaml-language-server: $schema=https://raw.githubusercontent.com/ritajhq/ensemble/main/.ensemble/schemas/workflow.schema.json

on:
  - github:
      push:
        tags:
          - '*.*.*'

jobs:
  release:
    steps:
      - id: checkout
        name: checkout
        run: |
          set -euo pipefail
          git clone https://github.com/ritajhq/ensemble.git
          cd ensemble
          git fetch --tags origin
          tag="$(git describe --tags --abbrev=0)"
          echo "tag=$tag" >> "$WORKFLOW_OUTPUT"

      - name: compile_cli
        run: |
          set -euo pipefail
          cd ensemble
          ens pack cli deno.compile

      - name: build_server_image
        run: |
          set -euo pipefail
          cd ensemble

          ens build server
          ens pack -o cli cli deno.compile

          ens pack server docker
      
      - name: publish_server_image
        run: |
          set -euo pipefail

          VERSION="${{ steps.checkout.outputs.tag }}"

          cd ensemble
          docker image tag server:latest registry.ritaj.app/ensemble/server:latest
          docker image tag server:latest registry.ritaj.app/ensemble/server:"$VERSION"

          docker login registry.ritaj.app -u "$REGISTRY_USERNAME" -p "$REGISTRY_PASSWORD"

          docker push registry.ritaj.app/ensemble/server:latest
          docker push registry.ritaj.app/ensemble/server:"$VERSION"

      - name: build_web
        run: |
          set -euo pipefail
          cd ensemble
          ens build web -m production

      - name: publish_web
        run: |
          set -euo pipefail

          VERSION="${{ steps.checkout.outputs.tag }}"

          cd ensemble
          mc alias set release-bucket https://s3.ritaj.app "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY"

          mc mirror --remove source/artifacts/web/ "release-bucket/releases/ensemble/web/${VERSION}"
          mc mirror --remove source/artifacts/web/ release-bucket/releases/ensemble/web/latest

      - name: update_changelog
        run: |
          set -euo pipefail
          cd ensemble
          tag="${{ steps.checkout.outputs.tag }}"

          cliff_version="2.13.1"
          if ! command -v git-cliff >/dev/null 2>&1; then
            arch="$(uname -m)"
            wget -qO /tmp/git-cliff.tar.gz \
              "https://github.com/orhun/git-cliff/releases/download/v${cliff_version}/git-cliff-${cliff_version}-${arch}-unknown-linux-musl.tar.gz"
            tar -xzf /tmp/git-cliff.tar.gz -C /tmp
            mv "/tmp/git-cliff-${cliff_version}/git-cliff" /usr/local/bin/git-cliff
          fi

          git-cliff --tag "$tag" -o CHANGELOG.md
          git-cliff --tag "$tag" --latest --strip all -o /tmp/ensemble-release-notes.md

          gh auth setup-git
          git config user.name "ensemble-release-bot"
          git config user.email "release-bot@ritaj.app"
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(changelog): update for $tag"

            attempt=1
            max_attempts=5
            until git push origin HEAD:main; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "error: could not push changelog to main after $max_attempts attempts (main kept moving)." >&2
                exit 1
              fi
              echo "push rejected, main moved — rebasing and retrying ($attempt/$max_attempts)..."
              git fetch origin main
              git rebase origin/main
              attempt=$((attempt + 1))
            done
          fi

      - name: create_github_release
        run: |
          set -euo pipefail
          cd ensemble
          tag="${{ steps.checkout.outputs.tag }}"
          gh release create "$tag" \
            source/artifacts/packages/ensemble-linux-x64 \
            --title "$tag" \
            --notes-file /tmp/ensemble-release-notes.md \
            --repo ritajhq/ensemble
