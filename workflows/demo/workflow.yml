# yaml-language-server: $schema=https://raw.githubusercontent.com/ritajhq/ensemble/main/.ensemble/schemas/workflow.schema.json

on:
  - manual:
      inputs:
        - name: message
          display: Message
          type: string

context:
  secrets:
    variables:
      - name: DEMO_SECRET
    files:
      - name: demo_conf
        path: demo.conf

jobs:
  demo:
    steps:
      - name: print_message
        run: |
          echo "${{ trigger.message }}"
          sleep 5

      - name: print_secret
        run: |
          echo "DEMO_SECRET (decrypted from contexts/${{ context.name }}/secrets.yml): $DEMO_SECRET"

      - name: print_secret_file
        run: |
          echo "demo.conf (decrypted from contexts/${{ context.name }}/secrets/demo.conf.enc):"
          cat "${{ context.secrets.files.demo_conf.path }}"

      - name: confirm_success
        run: echo "Demo workflow completed successfully."
