  <text x="1121.13" y="1078.35" fill="#d9d9d9" text-anchor="middle">Table, Bucket: the ports</text>
  <g font-size="12px">
  <text x="954.13" y="1233.15" fill="#8b8b8b" text-anchor="start">Of this side Ensemble checks only the bundle</text>
  <text x="954.13" y="1249.15" fill="#8b8b8b" text-anchor="start">it builds into. The app's shape and the</text>
  <text x="954.13" y="1265.15" fill="#8b8b8b" text-anchor="start">adapters' names are the project's own</text>
  <text x="954.13" y="1281.15" fill="#8b8b8b" text-anchor="start">convention.</text>
  </g>
