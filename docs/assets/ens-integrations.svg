<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1534" viewBox="0 0 2200 1534" font-family="'DejaVu Sans Mono', 'Menlo', 'Consolas', 'Liberation Mono', 'Courier New', monospace" font-size="14px">
  <defs>
    <marker id="arrow-5c5c7c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c5c7c"/>
    </marker>
    <marker id="arrow-5c5c7c-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c5c7c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="2200" height="1534" fill="#111111"/>
  <g font-size="17px">
  <text x="729.4" y="130.95" fill="#d9d9d9" text-anchor="start">What a deploy runs for an app</text>
  </g>
  <path d="M1143.4 40 H1477.4 a8 8 0 0 1 8 8 V202 a8 8 0 0 1 -8 8 H1143.4 a8 8 0 0 1 -8 -8 V48 a8 8 0 0 1 8 -8 Z" fill="none" stroke="none"/>

  <path d="M1157.4 54 H1463.4 a8 8 0 0 1 8 8 V112 a8 8 0 0 1 -8 8 H1157.4 a8 8 0 0 1 -8 -8 V62 a8 8 0 0 1 8 -8 Z" fill="#142814" stroke="#486544"/>
  <text x="1310.4" y="82.4" fill="#d9d9d9" text-anchor="middle">explicit — written in the manifest,</text>
  <text x="1310.4" y="101.4" fill="#d9d9d9" text-anchor="middle">config.yaml or the code</text>
  <path d="M1157.4 130 H1405.4 a8 8 0 0 1 8 8 V188 a8 8 0 0 1 -8 8 H1157.4 a8 8 0 0 1 -8 -8 V138 a8 8 0 0 1 8 -8 Z" fill="#2b1d0e" stroke="#d2904e"/>
  <text x="1281.4" y="158.4" fill="#d9d9d9" text-anchor="middle">convention — read off a name</text>
  <text x="1281.4" y="177.4" fill="#d9d9d9" text-anchor="middle">or a path, or only agreed on</text>
  <path d="M1603.4 92 H1884.4 a8 8 0 0 1 8 8 V150 a8 8 0 0 1 -8 8 H1603.4 a8 8 0 0 1 -8 -8 V100 a8 8 0 0 1 8 -8 Z" fill="#142814" stroke="#486544"/>
  <text x="1743.9" y="120.4" fill="#d9d9d9" text-anchor="middle">A resource in the manifest</text>
  <text x="1743.9" y="139.4" fill="#d9d9d9" text-anchor="middle">type, and engine: only if pinned</text>
  <path d="M1643.78 368.12 a100.12 100.12 0 1 0 200.24 0 a100.12 100.12 0 1 0 -200.24 0 Z" fill="#142814" stroke="#486544"/>
  <text x="1743.9" y="363.52" fill="#d9d9d9" text-anchor="middle">engine</text>
  <text x="1743.9" y="382.52" fill="#d9d9d9" text-anchor="middle">provided by the kit?</text>
  <path d="M1962.02 335.12 H2143.02 L2159.02 351.12 V393.12 a8 8 0 0 1 -8 8 H1962.02 a8 8 0 0 1 -8 -8 V343.12 a8 8 0 0 1 8 -8 Z" fill="#142814" stroke="#486544"/>
  <path d="M2143.02 335.12 V351.12 H2159.02" fill="none" stroke="#486544"/>
  <text x="2056.52" y="363.52" fill="#d9d9d9" text-anchor="middle">Refused, naming</text>
  <text x="2056.52" y="382.52" fill="#d9d9d9" text-anchor="middle">what the kit provides</text>
  <path d="M1561.4 549.64 H1926.4 a8 8 0 0 1 8 8 V607.64 a8 8 0 0 1 -8 8 H1561.4 a8 8 0 0 1 -8 -8 V557.64 a8 8 0 0 1 8 -8 Z" fill="#142814" stroke="#486544"/>
  <text x="1743.9" y="578.04" fill="#d9d9d9" text-anchor="middle">Core describes the granted resources</text>
  <text x="1743.9" y="597.04" fill="#d9d9d9" text-anchor="middle">ENSEMBLE_RESOURCE_*: type, engine, outputs</text>
  <path d="M715.9 246.5 H1038.9 a8 8 0 0 1 8 8 V304.5 a8 8 0 0 1 -8 8 H715.9 a8 8 0 0 1 -8 -8 V254.5 a8 8 0 0 1 8 -8 Z" fill="#142814" stroke="#486544"/>
  <text x="877.4" y="274.9" fill="#d9d9d9" text-anchor="middle">A release ships app server</text>
  <text x="877.4" y="293.9" fill="#d9d9d9" text-anchor="middle">ci/&lt;name&gt;/delivery.yml, its ship file</text>
  <path d="M711.4 422.5 H1043.4 a8 8 0 0 1 8 8 V480.5 a8 8 0 0 1 -8 8 H711.4 a8 8 0 0 1 -8 -8 V430.5 a8 8 0 0 1 8 -8 Z" fill="#142814" stroke="#486544"/>
  <text x="877.4" y="450.9" fill="#d9d9d9" text-anchor="middle">The kit deploying it</text>
  <text x="877.4" y="469.9" fill="#d9d9d9" text-anchor="middle">config.yaml's deploy.&lt;name&gt;.kit, or -k</text>
  <path d="M789.42 632.48 a87.98 87.98 0 1 0 175.96 0 a87.98 87.98 0 1 0 -175.96 0 Z" fill="#142814" stroke="#486544"/>
  <text x="877.4" y="627.88" fill="#d9d9d9" text-anchor="middle">build.server</text>
  <text x="877.4" y="646.88" fill="#d9d9d9" text-anchor="middle">has integrations?</text>
  <path d="M423.42 599.48 H671.42 a8 8 0 0 1 8 8 V657.48 a8 8 0 0 1 -8 8 H423.42 a8 8 0 0 1 -8 -8 V607.48 a8 8 0 0 1 8 -8 Z" fill="#142814" stroke="#486544"/>
  <text x="547.42" y="627.88" fill="#d9d9d9" text-anchor="middle">Build the app itself</text>
  <text x="547.42" y="646.88" fill="#d9d9d9" text-anchor="middle">build.server.kit — a program</text>
  <path d="M809.44 869.82 a67.96 67.96 0 1 0 135.91 0 a67.96 67.96 0 1 0 -135.91 0 Z" fill="#142814" stroke="#486544"/>
  <text x="877.4" y="865.22" fill="#d9d9d9" text-anchor="middle">integrations</text>
  <text x="877.4" y="884.22" fill="#d9d9d9" text-anchor="middle">.&lt;kit&gt;?</text>
  <path d="M494.44 836.82 H683.44 L699.44 852.82 V894.82 a8 8 0 0 1 -8 8 H494.44 a8 8 0 0 1 -8 -8 V844.82 a8 8 0 0 1 8 -8 Z" fill="#142814" stroke="#486544"/>
  <path d="M683.44 836.82 V852.82 H699.44" fill="none" stroke="#486544"/>
  <text x="592.94" y="865.22" fill="#d9d9d9" text-anchor="middle">Error — a library</text>
  <text x="592.94" y="884.22" fill="#d9d9d9" text-anchor="middle">with none for this kit</text>
  <path d="M732.4 1019.17 H1022.4 a8 8 0 0 1 8 8 V1077.17 a8 8 0 0 1 -8 8 H732.4 a8 8 0 0 1 -8 -8 V1027.17 a8 8 0 0 1 8 -8 Z" fill="#142814" stroke="#486544"/>
  <text x="877.4" y="1047.57" fill="#d9d9d9" text-anchor="middle">Its build kit, as configured</text>
  <text x="877.4" y="1066.57" fill="#d9d9d9" text-anchor="middle">node on aws, worker on cloudflare</text>
  <path d="M631.9 1141.17 H1122.9 a8 8 0 0 1 8 8 V1218.17 a8 8 0 0 1 -8 8 H631.9 a8 8 0 0 1 -8 -8 V1149.17 a8 8 0 0 1 8 -8 Z" fill="#2b1d0e" stroke="#d2904e"/>
  <text x="877.4" y="1169.57" fill="#d9d9d9" text-anchor="middle">Built from source/integrations/&lt;kit&gt;/server if it exists,</text>
  <text x="877.4" y="1188.57" fill="#d9d9d9" text-anchor="middle">else source/apps/server —</text>
  <text x="877.4" y="1207.57" fill="#d9d9d9" text-anchor="middle">main.ts becomes main.js, both named by core</text>
  <path d="M711.4 1282.17 H1035.4 L1051.4 1298.17 V1340.17 a8 8 0 0 1 -8 8 H711.4 a8 8 0 0 1 -8 -8 V1290.17 a8 8 0 0 1 8 -8 Z" fill="#142814" stroke="#486544"/>
  <path d="M1035.4 1282.17 V1298.17 H1051.4" fill="none" stroke="#486544"/>
  <text x="877.4" y="1310.57" fill="#d9d9d9" text-anchor="middle">A bundle whose main.js default-exports</text>
  <text x="877.4" y="1329.57" fill="#d9d9d9" text-anchor="middle">{ fetch(request, env) } — function.v1</text>
  <path d="M682.4 1404.17 H1072.4 a8 8 0 0 1 8 8 V1462.17 a8 8 0 0 1 -8 8 H682.4 a8 8 0 0 1 -8 -8 V1412.17 a8 8 0 0 1 8 -8 Z" fill="#142814" stroke="#486544"/>
  <text x="877.4" y="1432.57" fill="#d9d9d9" text-anchor="middle">The kit runs it: aws adds its Lambda adapter,</text>
  <text x="877.4" y="1451.57" fill="#d9d9d9" text-anchor="middle">cloudflare runs it as a Worker</text>
  <path d="M1283.3 830.52 H1668.3 a8 8 0 0 1 8 8 V1311.52 a8 8 0 0 1 -8 8 H1283.3 a8 8 0 0 1 -8 -8 V838.52 a8 8 0 0 1 8 -8 Z" fill="#191920" stroke="#25242f"/>
  <text x="1289.3" y="858.92" fill="#d9d9d9" text-anchor="start">What the entry does (project code)</text>
  <path d="M1309.8 873.52 H1641.8 a8 8 0 0 1 8 8 V931.52 a8 8 0 0 1 -8 8 H1309.8 a8 8 0 0 1 -8 -8 V881.52 a8 8 0 0 1 8 -8 Z" fill="#2b1d0e" stroke="#d2904e"/>
  <text x="1475.8" y="901.92" fill="#d9d9d9" text-anchor="middle">main.ts: Resources.from(env, adapters)</text>
  <text x="1475.8" y="920.92" fill="#d9d9d9" text-anchor="middle">then new Api(ports).fetch(request)</text>
  <path d="M1297.3 995.52 H1654.3 a8 8 0 0 1 8 8 V1053.52 a8 8 0 0 1 -8 8 H1297.3 a8 8 0 0 1 -8 -8 V1003.52 a8 8 0 0 1 8 -8 Z" fill="#2b1d0e" stroke="#d2904e"/>
  <text x="1475.8" y="1023.92" fill="#d9d9d9" text-anchor="middle">@ensemble-adapters/registry</text>
  <text x="1475.8" y="1042.92" fill="#d9d9d9" text-anchor="middle">the adapters this platform's bundle holds</text>
  <path d="M1330.8 1117.52 H1620.8 a8 8 0 0 1 8 8 V1175.52 a8 8 0 0 1 -8 8 H1330.8 a8 8 0 0 1 -8 -8 V1125.52 a8 8 0 0 1 8 -8 Z" fill="#2b1d0e" stroke="#d2904e"/>
  <text x="1475.8" y="1145.92" fill="#d9d9d9" text-anchor="middle">adapters, one per (type, engine)</text>
  <text x="1475.8" y="1164.92" fill="#d9d9d9" text-anchor="middle">aws-dynamo, aws-s3, cloudflare-d1</text>
  <path d="M1368.8 1239.52 H1582.8 a8 8 0 0 1 8 8 V1297.52 a8 8 0 0 1 -8 8 H1368.8 a8 8 0 0 1 -8 -8 V1247.52 a8 8 0 0 1 8 -8 Z" fill="#2b1d0e" stroke="#d2904e"/>
  <text x="1475.8" y="1267.92" fill="#d9d9d9" text-anchor="middle">@ensemble-adapters/core</text>
  <text x="1475.8" y="1286.92" fill="#d9d9d9" text-anchor="middle">Table, Bucket: the ports</text>
  <g font-size="12px">
  <text x="1313.8" y="1441.72" fill="#8b8b8b" text-anchor="start">Of the right-hand side Ensemble checks only</text>
  <text x="1313.8" y="1457.72" fill="#8b8b8b" text-anchor="start">the bundle it builds into and the description</text>
  <text x="1313.8" y="1473.72" fill="#8b8b8b" text-anchor="start">it hands the function. How code reads it is</text>
  <text x="1313.8" y="1489.72" fill="#8b8b8b" text-anchor="start">the project's own convention.</text>
  </g>
  <path d="M48 422.5 H514 L530 438.5 V480.5 a8 8 0 0 1 -8 8 H48 a8 8 0 0 1 -8 -8 V430.5 a8 8 0 0 1 8 -8 Z" fill="#142814" stroke="#486544"/>
  <path d="M514 422.5 V438.5 H530" fill="none" stroke="#486544"/>
  <text x="285" y="450.9" fill="#d9d9d9" text-anchor="middle">kit and integrations together, or neither, is an error:</text>
  <text x="285" y="469.9" fill="#d9d9d9" text-anchor="middle">an app is a program or a library, never both</text>
