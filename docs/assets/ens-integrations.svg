<svg xmlns="http://www.w3.org/2000/svg" width="1519" height="1492" viewBox="-76 0 1519 1492" font-family="'DejaVu Sans Mono', 'Menlo', 'Consolas', 'Liberation Mono', 'Courier New', monospace" font-size="14px">
