  <text x="476.23" y="1269.39" fill="#d9d9d9" text-anchor="middle">{ fetch(request, env) } — function.v1</text>
  <path d="M281.23 1343.99 H671.23 a8 8 0 0 1 8 8 V1401.99 a8 8 0 0 1 -8 8 H281.23 a8 8 0 0 1 -8 -8 V1351.99 a8 8 0 0 1 8 -8 Z" fill="#142814" stroke="#486544"/>
