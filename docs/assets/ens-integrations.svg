  <text x="880.23" y="158.4" fill="#d9d9d9" text-anchor="middle">convention — read off a name</text>
  <text x="880.23" y="177.4" fill="#d9d9d9" text-anchor="middle">or a path, or only agreed on</text>
  <path d="M314.73 246.5 H637.73 a8 8 0 0 1 8 8 V304.5 a8 8 0 0 1 -8 8 H314.73 a8 8 0 0 1 -8 -8 V254.5 a8 8 0 0 1 8 -8 Z" fill="#142814" stroke="#486544"/>
  <text x="476.23" y="274.9" fill="#d9d9d9" text-anchor="middle">A release ships app server</text>
  <text x="476.23" y="293.9" fill="#d9d9d9" text-anchor="middle">ci/&lt;name&gt;/delivery.yml, its ship file</text>
  <path d="M331.23 422.5 H621.23 a8 8 0 0 1 8 8 V480.5 a8 8 0 0 1 -8 8 H331.23 a8 8 0 0 1 -8 -8 V430.5 a8 8 0 0 1 8 -8 Z" fill="#142814" stroke="#486544"/>
  <text x="476.23" y="450.9" fill="#d9d9d9" text-anchor="middle">The kit deploying it</text>
  <text x="476.23" y="469.9" fill="#d9d9d9" text-anchor="middle">config.yaml's deploy entry, or -k</text>
