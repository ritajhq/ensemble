  <g font-size="17px">
  <text x="328.23" y="130.95" fill="#d9d9d9" text-anchor="start">What a deploy runs for an app</text>
  </g>
  <path d="M742.23 40 H1076.23 a8 8 0 0 1 8 8 V202 a8 8 0 0 1 -8 8 H742.23 a8 8 0 0 1 -8 -8 V48 a8 8 0 0 1 8 -8 Z" fill="none" stroke="none"/>

