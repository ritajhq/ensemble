role: pack
protocol: 1
# `binary` is the app's executable alone, as `cargo` leaves it; `installer` is `tauri build`, which compiles and bundles
# in one pass (the bundles named in tauri.yml). Neither needs the other.
modes:
  binary: binary
  installer: installer
# How the kit presents itself on the kits page: ens only checks it when installing.
about:
  title: Tauri
  summary: "Packs a desktop app with Tauri, as a binary or an installer."
  icon: icon.svg
  tags:
    - desktop
    - rust
