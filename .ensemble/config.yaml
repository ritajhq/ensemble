build:
  cli:
    kit: deno.bundle
  demo/spa:
    kit: react
  website/content:
    kit: react
    target: ssr
  website/server:
    kit: deno.bundle
hooks:
  release:
    after: >-
      git-cliff --tag "$ENSEMBLE_RELEASE_TAG" -o CHANGELOG.md && { git diff
      --quiet -- CHANGELOG.md || git commit CHANGELOG.md -m "chore(changelog):
      update for $ENSEMBLE_RELEASE_TAG"; }
