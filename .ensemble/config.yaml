build:
  cli:
    kit: deno.bundle
  git-sync:
    kit: deno.bundle
  preview:
    kit: deno.bundle
  platform/server:
    kit: deno.bundle
  platform/web:
    kit: react
  demo/spa:
    kit: react
  website/content:
    kit: react
    target: ssr
  website/server:
    kit: deno.bundle
  extension/vscode:
    kit: deno.bundle
    options:
      format: cjs
      external:
        - vscode
publish:
  core:
    - name: core
      package: "@ensemble/core"
      publish:
        - kit: jsr
    - name: host
      package: "@ensemble/host"
      publish:
        - kit: jsr
    - name: kit-sdk
      package: "@ensemble/kit-sdk"
      publish:
        - kit: jsr
hooks:
  release:
    after:
      - name: changelog
        run: >-
          RUST_LOG=off git-cliff --config .ensemble/configs/cliff.toml --latest
          --prepend CHANGELOG.md && { git diff --quiet -- CHANGELOG.md || git
          commit CHANGELOG.md -m "chore(changelog): update for $ENSEMBLE_RELEASE_TAG"; }
